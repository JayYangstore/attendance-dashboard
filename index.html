<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>奥迪南区 · 加班余额看板</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
  :root {
    --bg-canvas: #08090a;
    --bg-panel: #0f1011;
    --bg-surface: #191a1b;
    --bg-surface-hover: #1f2122;
    --border-soft: rgba(255,255,255,0.06);
    --border-mid: rgba(255,255,255,0.10);
    --text-primary: #f7f8f8;
    --text-secondary: #c5c9d2;
    --text-tertiary: #8a8f98;
    --text-muted: #5b6068;
    --accent: #5e6ad2;
    --green: #10b981;
    --amber: #f59e0b;
    --red: #e54c5e;
    --blue: #3b82f6;
    --radius: 16px;
    --radius-sm: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg-canvas);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", "Inter", sans-serif;
    font-feature-settings: "cv01", "ss03";
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body {
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(94,106,210,0.10), transparent 60%),
      radial-gradient(ellipse 50% 40% at 90% 10%, rgba(16,185,129,0.06), transparent 60%),
      var(--bg-canvas);
    padding: 20px 16px 60px;
  }
  .container {
    max-width: 1280px;
    margin: 0 auto;
  }

  /* ============ HEADER ============ */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 24px;
  }
  .header-left h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .header-left .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 10px rgba(16,185,129,0.6);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
  .header-left .sub {
    font-size: 12px;
    color: var(--text-tertiary);
    margin-top: 4px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
  }
  .header-right {
    display: flex; gap: 10px; align-items: center;
    font-size: 12px; color: var(--text-tertiary);
  }
  .badge {
    padding: 5px 10px;
    border-radius: 999px;
    background: var(--bg-surface);
    border: 1px solid var(--border-soft);
    font-family: "JetBrains Mono", ui-monospace, monospace;
  }
  .badge.green { background: rgba(16,185,129,0.12); border-color: rgba(16,185,129,0.25); color: var(--green); }

  /* ============ HERO: 半圆进度环 + 大字 ============ */
  .hero {
    display: grid;
    grid-template-columns: 1fr;
    gap: 24px;
    background: linear-gradient(135deg, var(--bg-panel) 0%, #0c0d0e 100%);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    padding: 28px 24px;
    margin-bottom: 16px;
    align-items: center;
    width: 100%;
    max-width: 100%;
    box-sizing: border-box;
  }
  .gauge-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .gauge-svg { display: block; max-width: 100%; height: auto; }
  .gauge-center-text {
    font-size: 56px;
    font-weight: 800;
    line-height: 1;
    color: #10b981;
    margin-top: -125px;
    margin-bottom: 125px;
    text-align: center;
    pointer-events: none;
  }
  .gauge-label {
    font-size: 12px;
    color: var(--text-tertiary);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 500;
  }
  .gauge-value {
    font-size: 56px;
    font-weight: 700;
    letter-spacing: -0.03em;
    color: var(--green);
    font-family: "JetBrains Mono", ui-monospace, monospace;
    line-height: 1.1;
    margin: 6px 0 4px;
  }
  .gauge-sub {
    font-size: 13px;
    color: var(--text-secondary);
    font-family: "JetBrains Mono", ui-monospace, monospace;
  }
  .hero-meta {
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: 100%;
    max-width: 100%;
    min-width: 0;
  }
  .meta-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;        /* v4: allow label+value to wrap to a 2nd line on narrow widths */
    padding: 10px 0;
    border-bottom: 1px solid var(--border-soft);
    font-size: 13px;
    gap: 6px 12px;
  }
  .meta-row:last-child { border-bottom: none; }
  .meta-row .k {
    color: var(--text-tertiary);
    flex: 0 0 auto;
    min-width: 0;
  }
  .meta-row .v {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-weight: 700;
    color: var(--text-primary);
    text-align: right;
    flex: 1 1 auto;
    min-width: 0;
    max-width: 100%;
    overflow-wrap: anywhere;
    word-break: break-word;
    font-size: 17px;
  }
  .meta-row .v.pct-highlight {
    color: var(--green);
    font-size: 22px;
  }
  .meta-row .v.red { color: var(--red); }
  .meta-row .v.amber { color: var(--amber); }
  .meta-row .v.green { color: var(--green); }
  .progress-bar {
    height: 6px;
    background: rgba(255,255,255,0.06);
    border-radius: 999px;
    overflow: hidden;
    margin-top: 4px;
  }
  .progress-bar > div {
    height: 100%;
    background: linear-gradient(90deg, var(--green) 0%, #34d399 100%);
    border-radius: 999px;
    transition: width 0.6s ease-out;
  }

  /* ============ 4 KPI CARDS ============ */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 16px;
  }
  .kpi-card {
    background: var(--bg-panel);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-sm);
    padding: 16px;
    position: relative;
    overflow: hidden;
    min-width: 0;
  }
  .kpi-card .value { overflow-wrap: anywhere; word-break: break-word; }
  .kpi-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--blue));
    opacity: 0.5;
  }
  .kpi-card .label {
    font-size: 11px;
    color: var(--text-tertiary);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 500;
    margin-bottom: 8px;
  }
  .kpi-card .value {
    font-size: 28px;
    font-weight: 700;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    letter-spacing: -0.02em;
    line-height: 1.1;
  }
  .kpi-card .delta {
    font-size: 11px;
    color: var(--text-tertiary);
    margin-top: 6px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
  }
  .kpi-card .delta.up { color: var(--green); }
  .kpi-card .delta.down { color: var(--red); }

  /* ============ TREND CHART ============ */
  .card {
    background: var(--bg-panel);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
    max-width: 100%;
    overflow-x: hidden;
  }
  .card-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .card-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-title .ico { color: var(--text-tertiary); }
  .card-sub {
    font-size: 11px;
    color: var(--text-tertiary);
    font-family: "JetBrains Mono", ui-monospace, monospace;
  }
  #trend-chart { width: 100%; height: 280px; }
  .echarts-tooltip { max-width: 240px !important; }
  /* v5: 趋势图下方一行小字警告 (不压图标) */
  .trend-alert {
    margin-top: 8px;
    padding: 8px 10px;
    background: rgba(229,76,94,0.08);
    border: 1px solid rgba(229,76,94,0.20);
    border-radius: 8px;
    color: #f59e0b;
    font-size: 12px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    line-height: 1.6;
  }

  /* ============ TABLE ============ */
  .table-card { padding: 0; overflow: hidden; }
  .table-toggle {
    width: 100%;
    background: transparent;
    border: none;
    color: var(--text-primary);
    padding: 18px 20px;
    text-align: left;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
  }
  .table-toggle:hover { background: var(--bg-surface-hover); }
  .table-toggle .arrow {
    transition: transform 0.25s ease;
    color: var(--text-tertiary);
    font-size: 12px;
  }
  .table-toggle[aria-expanded="true"] .arrow { transform: rotate(180deg); }
  .table-toggle .count {
    font-size: 11px;
    color: var(--text-tertiary);
    font-family: "JetBrains Mono", ui-monospace, monospace;
    margin-right: 10px;
    font-weight: 400;
  }
  .table-wrap {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.35s ease;
  }
  .table-wrap.open { max-height: 600px; overflow: auto; }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }
  th {
    background: #1F4E78;
    color: #ffffff;
    font-weight: 700;
    text-transform: none;
    letter-spacing: 0;
    padding: 14px 12px;
    text-align: right;
    position: sticky;
    top: 0;
    border-bottom: 2px solid rgba(255,255,255,0.15);
    font-size: 14px;
    z-index: 10;
  }
  th:first-child, th:nth-child(2) { text-align: left; }
  /* v5: 行高亮 — 深色背景 + 白字加粗, 提升对比度 */
  tr.row-leave { background: #7f1d1d; }
  tr.row-leave td { color: #ffffff !important; }
  tr.row-leave td.tag.leave {
    background: #ffffff;
    color: #7f1d1d;
    font-weight: 700;
  }
  tr.row-leave .src-cell,
  tr.row-leave td:first-child,
  tr.row-leave td:nth-child(2) { color: #ffffff !important; font-weight: 700; }
  tr.row-patch { background: #1e3a8a; }
  tr.row-patch td { color: #ffffff !important; }
  tr.row-patch td.src-cell {
    color: #ffffff !important;
    font-weight: 700;
  }
  tr.row-patch td:first-child,
  tr.row-patch td:nth-child(2) { color: #ffffff !important; font-weight: 700; }
  tr.row-patch td.tag.leave {
    background: #fbbf24;
    color: #1e3a8a;
    font-weight: 700;
  }
  /* v5: 待补卡 vs 已补卡 颜色徽章 */
  .patch-pending { background: #fbbf24 !important; color: #1e3a8a !important; font-weight: 700; padding: 2px 8px; border-radius: 6px; font-size: 11px; }
  .patch-done    { background: transparent !important; color: #ffffff !important; font-weight: 700; font-size: 11px; }
  td {
    padding: 9px 12px;
    text-align: right;
    border-bottom: 1px solid var(--border-soft);
    font-family: "JetBrains Mono", ui-monospace, monospace;
    color: var(--text-secondary);
  }
  td:first-child, td:nth-child(2) { text-align: left; font-family: inherit; }
  tr:hover td { background: var(--bg-surface-hover); }
  td.num-pos { color: var(--green); }
  td.num-neg { color: var(--red); }
  td.tag {
    display: inline-block;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 10px;
    font-family: inherit;
  }
  td.tag.leave { background: rgba(245,158,11,0.15); color: var(--amber); }
  td.tag.work  { background: rgba(94,106,210,0.15); color: var(--accent); }
  td.tag.we    { background: rgba(139,148,158,0.15); color: var(--text-tertiary); }
  td.tag.single { background: rgba(16,185,129,0.12); color: var(--green); }

  /* ============ FOOTER ============ */
  .footer {
    margin-top: 24px;
    text-align: center;
    font-size: 11px;
    color: var(--text-muted);
    font-family: "JetBrains Mono", ui-monospace, monospace;
  }

  /* ============ TABLET (768px - 1023px) ============ */
  /* Fills the gap between mobile (≤767) and desktop (≥1024) so iPad widths
     don't fall through to the un-overridden base styles (causes ring/text
     overlap and a 2-col KPI grid that gets cramped).
     v6: tablet band starts at 768 (was 769) to cover iPad portrait 768,
     since mobile cut-off is ≤767. The 768 viewport now properly gets
     2×2 KPI grid + column-stacked meta-rows. */
  @media (min-width: 768px) and (max-width: 1023px) {
    body { padding: 24px 24px 70px; }
    .hero {
      grid-template-columns: 280px 1fr;
      padding: 28px;
      gap: 32px;
    }
    .gauge-svg { width: 280px; height: 170px; }
    .gauge-center-text { margin-top: -90px; margin-bottom: 90px; }
    .gauge-value { font-size: 44px; }
    .gauge-label { font-size: 11px; }
    .gauge-sub { font-size: 11px; }
    .hero-meta { gap: 10px; }

    /* v6: meta-row — 4 行单列垂直堆叠 (label 上, value 下),
       解决 iPad portrait (768-820) 上 value 被 label 挤到右侧裁切。
       桌面 ≥1024 不动。 */
    .meta-row {
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      padding: 8px 0;
      font-size: 12px;
    }
    .meta-row .v { font-size: 15px; text-align: left; }
    .meta-row .v.pct-highlight { font-size: 19px; }

    /* v4: KPI cards — 2×2 grid at tablet (the parent spec asked for this
       explicitly: "768px 改 2×2 网格，剩下一张独占一行"). The 3rd card
       naturally sits on its own row, full width. */
    .kpi-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .kpi-card { padding: 14px; min-width: 0; }
    .kpi-card .value { font-size: 26px; }
    .kpi-card .label { font-size: 10px; }
    .kpi-card .delta { font-size: 10px; }
    #trend-chart { height: 210px; }
    .card { padding: 18px; }
    .card-title { font-size: 13px; }
    .table-wrap.open { max-height: 480px; }
    th, td { padding: 10px 9px; font-size: 11px; }
    .header-left h1 { font-size: 17px; }
    .header-right .badge { font-size: 10px; padding: 4px 9px; }
  }

  /* ============ DESKTOP (>=1024px) ============ */
  @media (min-width: 1024px) {
    body { padding: 32px 40px 80px; }
    .hero {
      grid-template-columns: 420px 1fr;
      padding: 36px;
      gap: 48px;
    }
    .gauge-svg { width: 420px; height: 260px; }
    .gauge-center-text { margin-top: -120px; margin-bottom: 120px; }
    .gauge-value { font-size: 56px; }
    .kpi-grid { grid-template-columns: repeat(3, 1fr); }
    .kpi-card .value { font-size: 32px; }
    #trend-chart { height: 220px; }
    .table-wrap.open { max-height: 500px; }
  }

  /* ============ MOBILE (<=767px) ============ */
  /* v4: changed from 768 → 767 so 768px (iPad portrait) falls into the
     tablet band (which is now 2×2 KPI per spec). 768 is iPad portrait,
     not a phone width. */
  @media (max-width: 767px) {
    body { padding: 16px 12px 60px; }
    .hero { padding: 18px 12px; }
    .gauge-svg { width: 240px; height: 145px; }
    .gauge-center-text { margin-top: -37px; margin-bottom: 37px; }
    .gauge-value { font-size: 36px; letter-spacing: -0.04em; }
    .gauge-label { font-size: 11px; }
    .gauge-sub { font-size: 11px; }

    /* v6: meta-row — 4 行单列垂直堆叠 (label 上, value 下),
       彻底解决 360-414 mobile 上 value 被 label 挤右裁切。
       桌面 ≥1024 不动,desktop 仍是单行 (justify-content: space-between)。 */
    .meta-row {
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      font-size: 12px;
      padding: 8px 0;
    }
    .meta-row .v {
      font-size: 13px;        /* v6: 12px → 13px 更稳 */
      flex: 1 1 0;
      min-width: 0;
      max-width: 100%;
      overflow-wrap: anywhere;
      word-break: break-word;
      text-align: left;        /* v6: 左对齐与 label 一致 */
    }
    .meta-row .v.pct-highlight { font-size: 16px; }

    /* v6: KPI cards — 1×3 横向保持,加 min-width: 0 + value 18px
       字号,确保 "163h49m" 在 360-414 mobile 都完整,不被卡边界切。 */
    .kpi-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
    }
    .kpi-card { padding: 10px 6px; min-width: 0; }
    .kpi-card .value {
      font-size: 18px;        /* v6: 20px → 18px 更紧凑,留出 padding */
      letter-spacing: -0.02em;
    }
    .kpi-card .label { font-size: 9px; letter-spacing: 0.04em; }
    .kpi-card .delta { font-size: 9px; line-height: 1.3; }
    .card { padding: 18px 16px; }
    .card-title { font-size: 13px; }
    .card-sub { font-size: 10px; }
    #trend-chart { height: 200px; }
    th, td { padding: 8px 6px; font-size: 11px; }
    th { font-size: 10px; }
    .header-left h1 { font-size: 16px; }
    .header-right .badge { font-size: 10px; padding: 4px 8px; }
    .header { gap: 8px; }
    /* v5: 手机端折叠按钮加大 — 48px 高 / 16px 字 / padding 20px 全宽 */
    .table-toggle {
      min-height: 52px;
      padding: 16px 20px;
      font-size: 16px;
      letter-spacing: 0.01em;
    }
    .table-toggle .count { font-size: 13px; margin-right: 12px; }
    .table-toggle .arrow { font-size: 16px; }

    /* v9 mobile: 计划列（"周末单卡"4 字）一行不换 */
    td:nth-child(3) { white-space: nowrap; }

    /* v13 mobile: 表格整体可横向滚动，所有列都可见 */
    .table-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .table-wrap table { min-width: 720px; }
    th, td { padding: 8px 6px; font-size: 11px; white-space: nowrap; }

    /* v13 mobile: 打卡源列 — emoji + "手动修正" 同行，
       "（已补卡）" 由 JS 的 <br> 强制独立换行 */
    td:nth-child(6) {
      font-size: 10px !important;
      line-height: 1.3;
    }
    td:nth-child(6) .patch-done,
    td:nth-child(6) .patch-pending {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 9px;
      white-space: nowrap;
    }
  }
</style>
</head>
<body>
<div class="container">

  <!-- HEADER -->
  <div class="header">
    <div class="header-left">
      <h1><span class="dot"></span>奥迪南区 · 加班余额看板</h1>
      <div class="sub" id="header-sub">加载中…</div>
    </div>
    <div class="header-right">
      <span class="badge green" id="badge-state">健康</span>
    </div>
  </div>

  <!-- HERO -->
  <section class="hero">
    <div class="gauge-wrap">
      <svg class="gauge-svg" viewBox="0 0 200 120" width="280" height="170" aria-hidden="true">
        <defs>
          <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#10b981"/>
            <stop offset="50%" stop-color="#34d399"/>
            <stop offset="100%" stop-color="#5e6ad2"/>
          </linearGradient>
        </defs>
        <!-- background arc -->
        <path d="M 20 110 A 80 80 0 0 1 180 110"
              fill="none"
              stroke="rgba(255,255,255,0.06)"
              stroke-width="14"
              stroke-linecap="round"/>
        <!-- progress arc (animated) -->
        <path id="gauge-arc"
              d="M 20 110 A 80 80 0 0 1 180 110"
              fill="none"
              stroke="url(#gaugeGrad)"
              stroke-width="14"
              stroke-linecap="round"
              stroke-dasharray="251.2"
              stroke-dashoffset="251.2"/>
      </svg>
      <div class="gauge-center-text">
        <div class="gauge-label">剩余加班</div>
        <div class="gauge-value" id="gauge-value">—</div>
        <div class="gauge-sub" id="gauge-sub">基准 202h</div>
      </div>
    </div>
    <div class="hero-meta">
      <div class="meta-row">
        <span class="k">已消耗</span>
        <span class="v" id="meta-used">—</span>
      </div>
      <div class="meta-row">
        <span class="k">已消耗比例</span>
        <span class="v" id="meta-pct">—</span>
      </div>
      <div class="meta-row">
        <span class="k">最后更新</span>
        <span class="v" id="meta-last">—</span>
      </div>
      <div class="meta-row">
        <span class="k">预计可撑</span>
        <span class="v" id="meta-days">—</span>
      </div>

          </div>
          <div style="display:flex;justify-content:space-between;gap:18px;margin:3px 0;">
            <span style="color:#8a8f98;">当日净</span>
            <span style="color:${d.net>=0?'#10b981':'#e54c5e'};font-weight:600;">${d.net>=0?'+':''}${d.net}m</span>
          </div>
          ${d.leave && d.leave!=='-' ? `<div style="margin-top:6px;color:#f59e0b;">📌 ${d.leave}</div>` : ''}`;
      }
    },
    xAxis: {
      type: 'category',
      data: dates,
      boundaryGap: false,
      axisLine: { lineStyle: { color: 'rgba(255,255,255,0.08)' } },
      axisTick: { show: false },
      axisLabel: {
        color: '#8a8f98',
        fontSize: 11,
        fontFamily: 'JetBrains Mono, monospace',
        interval: Math.max(0, Math.floor(dates.length / (window.innerWidth < 768 ? 6 : 8)))
      }
    },
    yAxis: {
      type: 'value',
      name: '剩余工时 (h)',
      nameTextStyle: { color: '#8a8f98', fontSize: 11, padding: [0,0,8,-30] },
      min: (val) => Math.floor(val.min / 10) * 10 - 5,
      max: (val) => Math.ceil(val.max / 10) * 10 + 5,
      axisLine: { show: false },
      axisTick: { show: false },
      splitLine: { lineStyle: { color: 'rgba(255,255,255,0.04)' } },
      axisLabel: { color: '#8a8f98', fontSize: 11, fontFamily: 'JetBrains Mono, monospace', formatter: '{value}h' }
    },
    series: [
      {
        name: '基准',
        type: 'line',
        data: dates.map(() => BASELINE / 60),
        showSymbol: false,
        smooth: false,
        lineStyle: { color: '#8a8f98', type: 'dashed', width: 1, opacity: 0.4 },
        tooltip: { show: false },
        z: 1
      },
      {
        name: '剩余加班',
        type: 'line',
        data: remainHours,
        smooth: true,
        symbol: 'circle',
        symbolSize: 5,
        showSymbol: true,
        lineStyle: { color: '#10b981', width: 2.5 },
        itemStyle: { color: '#10b981', borderColor: '#0f1011', borderWidth: 2 },
        areaStyle: {
          color: {
            type: 'linear', x: 0, y: 0, x2: 0, y2: 1,
            colorStops: [
              { offset: 0, color: 'rgba(16,185,129,0.30)' },
              { offset: 1, color: 'rgba(16,185,129,0.02)' }
            ]
          }
        },
        markPoint: {
          symbol: 'pin',
          symbolSize: 28,
          data: markPoints,
          label: { show: false }
        },
        z: 5
      }
    ]
  });

  // subtitle
  const firstH = remainHours[0];
  const lastH = remainHours[remainHours.length - 1];
  const diff = lastH - firstH;
  document.getElementById('trend-sub').textContent =
    `${recent30[0].date} – ${recent30[recent30.length-1].date} · 区间 ${diff>=0?'+':''}${diff.toFixed(2)}h`;

  // v5: 趋势图下方一行小字警告 (e.g. "⚠️ 7.24 全天请假 -480")，不压图
  const alertEl = document.getElementById('trend-alert');
  if (alertEl) {
    if (alertLines.length) {
      alertEl.innerHTML = alertLines.map(line =>
        `<span style="margin-right:14px;">${line}</span>`
      ).join('');
      alertEl.style.display = 'block';
    } else {
      alertEl.style.display = 'none';
    }
  }

  window.addEventListener('resize', () => chart.resize());
})();

// ---------- DETAIL TABLE ----------
(function renderTable(){
  document.getElementById('table-count').textContent = `${DATA.length} 行`;
  const ft = document.getElementById('footer-source');
  if (ft) {
    const today = new Date();
    const pad = n => String(n).padStart(2, '0');
    const stamp = `${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())} ${pad(today.getHours())}:${pad(today.getMinutes())}`;
    ft.innerHTML = `数据源 · 考勤对账主表 · <b>${DATA.length} 行</b> · 本页最后刷新 ${stamp}`;
  }
  const tbody = document.getElementById('table-body');
  const rows = DATA.slice().reverse().map(d => {
    const netCls = d.net > 0 ? 'num-pos' : (d.net < 0 ? 'num-neg' : '');
    const lateCls = d.late < 0 ? 'num-neg' : '';
    const isFullLeave = d.leave === '全天请假';
    const isPatched = d.src === '手动修正' || d.src === '系统补卡';
    const rowCls = isFullLeave ? 'row-leave' : (isPatched ? 'row-patch' : '');

    // v5: MANUAL/SYSTEM 行处理规则
    // - 手动修正 + OA 有补卡单 → "手动修正（已补卡）" 绿色 ✅
    // - 手动修正 + OA 没补卡单 → "手动修正（待补卡）" 黄色 ⚠️
    // - 系统补卡（系统自动重打，Jay 没发起 OA） → "系统补卡" 中性
    // - 其他 → 原始 src
    let srcDisplay = d.src;
    let srcTagCls = '';
    let srcTagEmoji = '';
    const isMobile = window.innerWidth <= 767;
    if (d.src === '手动修正') {
      const hasOA = patchHasOA(d.full_date);
      // 移动端：<br> 强制 "（已补卡）" 独立一行
      // 桌面端：单行显示 "手动修正（已补卡）"
      if (isMobile) {
        srcDisplay = hasOA ? '手动修正<br><span class="patch-done">（已补卡）</span>' : '手动修正<br><span class="patch-pending">（待补卡）</span>';
      } else {
        srcDisplay = hasOA ? '手动修正（已补卡）' : '手动修正（待补卡）';
      }
      srcTagCls = hasOA ? 'patch-done' : 'patch-pending';
      srcTagEmoji = hasOA ? '✅' : '⚠️';
    } else if (d.src === '系统补卡') {
      srcTagCls = '';
      srcTagEmoji = '🔧';
    }
    // 计划列：data.rule 已经是规则描述（"工作日" / "周末单卡=不计" / "全天请假8h=-480 · 全天请假-480"），保留核心
    let planTxt = d.rule;
    if (planTxt.startsWith('全天请假')) planTxt = '全天请假';
    else if (planTxt.startsWith('周末')) planTxt = '周末单卡';
    else planTxt = '工作日';
    const leaveCell = d.leave && d.leave !== '-'
      ? `<span class="tag leave">${d.leave}</span>`
      : (d.rule === '周末/单卡不计' ? '<span class="tag we">周末</span>' : (d.rule === '工作日' ? '<span class="tag work">工作日</span>' : '<span class="tag single">单卡</span>'));
    return `<tr class="${rowCls}">
      <td class="col-date">${d.date}</td>
      <td class="col-wday">${d.weekday}</td>
      <td style="font-family:inherit;color:var(--text-tertiary);font-size:11px;">${planTxt}</td>
      <td>${d.in || '—'}</td>
      <td>${d.out || '—'}</td>
      <td class="src-cell" style="font-family:inherit;font-size:11px;">
        ${srcTagEmoji ? srcTagEmoji + ' ' : ''}<span class="${srcTagCls}">${srcDisplay}</span>
      </td>
      <td class="${lateCls}">${d.late ? d.late + 'm' : '—'}</td>
      <td class="${d.ot > 0 ? 'num-pos' : ''}">${d.ot ? '+' + d.ot + 'm' : '—'}</td>
      <td>${d.early ? d.early + 'm' : '—'}</td>
      <td class="${netCls}">${d.net ? (d.net > 0 ? '+' : '') + d.net + 'm' : '—'}</td>
      <td style="font-weight:600;">${d.rem_hm}</td>
      <td>${leaveCell}</td>
    </tr>`;
  }).join('');
  tbody.innerHTML = rows;
})();

// ---------- toggle ----------
document.getElementById('table-toggle').addEventListener('click', (e) => {
  const wrap = document.getElementById('table-wrap');
  const btn = e.currentTarget;
  const isOpen = wrap.classList.toggle('open');
  btn.setAttribute('aria-expanded', String(isOpen));
});

// URL #expand 自动展开明细表（截图/分享用）
if (location.hash === '#expand') {
  setTimeout(() => {
    const wrap = document.getElementById('table-wrap');
    const btn = document.getElementById('table-toggle');
    if (wrap && !wrap.classList.contains('open')) {
      wrap.classList.add('open');
      btn.setAttribute('aria-expanded', 'true');
    }
    // scroll to table
    document.getElementById('table-toggle').scrollIntoView({behavior: 'instant', block: 'start'});
  }, 300);
}
</script>
</body>
</html>
